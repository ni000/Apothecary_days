<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apothecary Days</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Game Container -->
    <div id="game-container">
      
      <!-- Background Layers -->
      <div id="exterior-bg" class="bg-layer active"></div>
      <div id="interior-bg" class="bg-layer"></div>

      <!-- Game Canvas (for player & NPC) -->
      <canvas id="game-canvas" width="1920" height="1080"></canvas>

      <!-- Main Menu Overlay -->
      <div id="main-menu" class="overlay active">
        <h1 class="game-title">Apothecary Days</h1>
        <button id="start-btn" class="fantasy-btn">Start Game</button>
      </div>

      <!-- HUD Overlay -->
      <div id="hud" class="overlay hidden">
        <div class="hud-panel objective-panel">
          <span id="objective-text">Objective: Open Shop</span>
        </div>
        <div class="hud-panel coin-panel">
          <span id="coin-text">🪙 150</span>
        </div>
      </div>

      <!-- Dialogue Overlay -->
      <div id="dialogue-ui" class="overlay hidden">
        <div class="dialogue-box">
          <div class="dialogue-name">Customer</div>
          <div id="dialogue-text" class="dialogue-text"></div>
          <div class="dialogue-prompt blink hidden">Press E to continue</div>
        </div>
      </div>

      <!-- Interaction Prompt -->
      <div id="interaction-prompt" class="hidden">Press E</div>

      <!-- Book UI Overlay -->
      <div id="book-ui" class="overlay hidden">
        <div class="book-overlay-bg"></div>
        <div class="book-container">
          <!-- Close Button -->
          <button id="book-close-btn" class="book-close-btn" aria-label="Close Book">&times;</button>
          
          <div class="book-pages">
            <!-- Left Page: Table of Contents & Sketch -->
            <div class="book-page left-page">
              <div class="page-content" id="left-page-content">
                <h2 class="book-title">Apothecary's Guide</h2>
                <div class="book-divider"></div>
                <p class="book-intro">A collection of remedies, decoctions, and healing preparations.</p>
                
                <h3 class="index-title">Table of Contents</h3>
                <ul class="recipe-index">
                  <li data-page="1" class="index-item active">Page 1 &mdash; Willow Bark Decoction</li>
                  <li data-page="2" class="index-item">Page 2 &mdash; Healing Salve</li>
                  <li data-page="3" class="index-item">Page 3 &mdash; Tulsi-Ginger Syrup</li>
                </ul>
                <div class="botanical-sketch">
                  <span class="sketch-icon">🍃</span>
                  <span class="sketch-icon">🌸</span>
                  <span class="sketch-icon">🧪</span>
                </div>
              </div>
            </div>
            
            <!-- Spine Crease -->
            <div class="book-spine"></div>
            
            <!-- Right Page: Active Recipe Details -->
            <div class="book-page right-page">
              <div class="page-content" id="right-page-content">
                <!-- Dynamically filled by JS -->
              </div>
            </div>
          </div>
          
          <!-- Navigation arrows -->
          <button id="book-prev-btn" class="book-nav-btn prev" aria-label="Previous Page">&#129144;</button>
          <button id="book-next-btn" class="book-nav-btn next" aria-label="Next Page">&#129146;</button>
        </div>
      </div>


      <!-- Manuscript UI Overlay (Single Page View for Acquired Recipes) -->
      <div id="manuscript-ui" class="overlay hidden">
        <div class="book-overlay-bg"></div>
        <div class="manuscript-container">
          <!-- Gold Corners -->
          <div class="corner-bracket top-left"></div>
          <div class="corner-bracket top-right"></div>
          <div class="corner-bracket bottom-left"></div>
          <div class="corner-bracket bottom-right"></div>
          
          <!-- Close Button -->
          <button id="manuscript-close-btn" class="book-close-btn" aria-label="Close Manuscript">&times;</button>
          
          <div class="manuscript-page">
            <div class="page-content" id="manuscript-page-content">
              <!-- Dynamically filled by JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Acquired Recipes Container (Floating badges on the screen) -->
      <div id="acquired-recipes-container"></div>
    </div>
    


    <script type="module" src="main.js"></script>
  </body>
</html>
